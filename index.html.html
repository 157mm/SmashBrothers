
<h2 class="sr-only">Smash Bros Ultimate League — classement ELO, résultats de matchs et gestion des joueurs</h2>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .tabs { display: flex; gap: 4px; border-bottom: 0.5px solid var(--color-border-tertiary); margin-bottom: 1.5rem; padding-top: 1rem; }
  .tab { padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: var(--border-radius-md) var(--border-radius-md) 0 0; border: 0.5px solid transparent; color: var(--color-text-secondary); background: transparent; transition: all 0.15s; }
  .tab.active { background: var(--color-background-primary); border-color: var(--color-border-tertiary); border-bottom-color: var(--color-background-primary); color: var(--color-text-primary); font-weight: 500; }
  .tab:hover:not(.active) { color: var(--color-text-primary); background: var(--color-background-secondary); }
  .page { display: none; }
  .page.active { display: block; }

  .rank-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rank-table th { text-align: left; padding: 8px 12px; font-size: 12px; font-weight: 500; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); }
  .rank-table td { padding: 10px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .rank-table tr:last-child td { border-bottom: none; }
  .rank-table tr:hover td { background: var(--color-background-secondary); }
  .rank-num { font-weight: 500; color: var(--color-text-secondary); width: 32px; }
  .rank-1 { color: #C59A00; }
  .rank-2 { color: #888780; }
  .rank-3 { color: #8B5E3C; }
  .player-name { font-weight: 500; }
  .elo-badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--color-background-info); color: var(--color-text-info); }
  .trend { font-size: 12px; }
  .trend.up { color: var(--color-text-success); }
  .trend.down { color: var(--color-text-danger); }
  .trend.neutral { color: var(--color-text-secondary); }

  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .card-title { font-size: 14px; font-weight: 500; margin-bottom: 1rem; color: var(--color-text-primary); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-label { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; }
  select, input[type="text"] { width: 100%; padding: 8px 10px; font-size: 14px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); }
  .score-inputs { display: flex; align-items: center; gap: 12px; }
  .score-inputs input[type="number"] { width: 60px; text-align: center; padding: 8px; font-size: 18px; font-weight: 500; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); }
  .vs-label { font-size: 14px; font-weight: 500; color: var(--color-text-secondary); }
  .btn-primary { padding: 9px 20px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.8; }
  .btn-secondary { padding: 8px 16px; background: transparent; color: var(--color-text-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); font-size: 14px; cursor: pointer; transition: background 0.15s; }
  .btn-secondary:hover { background: var(--color-background-secondary); }
  .btn-danger { padding: 6px 12px; background: transparent; color: var(--color-text-danger); border: 0.5px solid var(--color-border-danger, #e24b4a55); border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer; }
  .btn-danger:hover { background: var(--color-background-danger); }

  .match-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 14px; }
  .match-item:last-child { border-bottom: none; }
  .match-players { flex: 1; display: flex; align-items: center; gap: 8px; }
  .match-score { font-weight: 500; font-size: 16px; min-width: 60px; text-align: center; }
  .match-elo { font-size: 12px; color: var(--color-text-secondary); min-width: 80px; text-align: right; }
  .match-date { font-size: 12px; color: var(--color-text-tertiary); }
  .winner-tag { font-size: 11px; padding: 2px 6px; background: var(--color-background-success); color: var(--color-text-success); border-radius: 4px; font-weight: 500; }

  .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .player-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px; flex-shrink: 0; }
  .player-info { flex: 1; min-width: 0; }
  .player-info .name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-info .stats { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem; }
  .stat-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }

  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--color-text-primary); color: var(--color-background-primary); padding: 10px 16px; border-radius: var(--border-radius-md); font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; }

  .add-player-form { display: flex; gap: 8px; margin-top: 1rem; }
  .add-player-form input { flex: 1; }
  .empty-state { text-align: center; padding: 2rem; color: var(--color-text-secondary); font-size: 14px; }

  .char-emoji { font-size: 18px; }
</style>

<div class="tabs">
  <button class="tab active" onclick="showTab('classement')"><i class="ti ti-trophy" aria-hidden="true"></i> Classement</button>
  <button class="tab" onclick="showTab('match')"><i class="ti ti-sword" aria-hidden="true"></i> Résultat</button>
  <button class="tab" onclick="showTab('historique')"><i class="ti ti-history" aria-hidden="true"></i> Historique</button>
  <button class="tab" onclick="showTab('joueurs')"><i class="ti ti-users" aria-hidden="true"></i> Joueurs</button>
</div>

<div id="tab-classement" class="page active">
  <div class="stats-grid" id="stats-grid"></div>
  <div class="card" style="padding: 0; overflow: hidden;">
    <table class="rank-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Joueur</th>
          <th>ELO</th>
          <th>V</th>
          <th>D</th>
          <th>% Victoires</th>
          <th>Tendance</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </div>
</div>

<div id="tab-match" class="page">
  <div class="card">
    <div class="card-title">Enregistrer un résultat</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Joueur 1</label>
        <select id="p1-select"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Joueur 2</label>
        <select id="p2-select"></select>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:12px;">
      <label class="form-label">Score (stocks / sets remportés)</label>
      <div class="score-inputs">
        <input type="number" id="score1" min="0" max="9" value="3" />
        <span class="vs-label">–</span>
        <input type="number" id="score2" min="0" max="9" value="0" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Personnage J1 (optionnel)</label>
        <input type="text" id="char1" placeholder="ex: Pikachu" />
      </div>
      <div class="form-group">
        <label class="form-label">Personnage J2 (optionnel)</label>
        <input type="text" id="char2" placeholder="ex: Marth" />
      </div>
    </div>
    <button class="btn-primary" onclick="submitMatch()"><i class="ti ti-check" aria-hidden="true"></i> Valider le match</button>
  </div>

  <div class="card" id="elo-preview" style="display:none;">
    <div class="card-title">Aperçu ELO</div>
    <div id="elo-preview-content"></div>
  </div>
</div>

<div id="tab-historique" class="page">
  <div class="card" style="padding: 0; overflow: hidden;">
    <div id="match-history"></div>
  </div>
</div>

<div id="tab-joueurs" class="page">
  <div class="card">
    <div class="card-title">Ajouter un joueur</div>
    <div class="add-player-form">
      <input type="text" id="new-player-name" placeholder="Pseudo du joueur" maxlength="20" />
      <button class="btn-primary" onclick="addPlayer()"><i class="ti ti-plus" aria-hidden="true"></i> Ajouter</button>
    </div>
  </div>
  <div class="player-grid" id="player-grid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'smash_league_v1';
const AVATAR_COLORS = [
  {bg:'#E6F1FB',text:'#0C447C'},{bg:'#EAF3DE',text:'#3B6D11'},
  {bg:'#FAECE7',text:'#993C1D'},{bg:'#FAEEDA',text:'#854F0B'},
  {bg:'#EEEDFE',text:'#3C3489'},{bg:'#FBEAF0',text:'#993556'},
  {bg:'#E1F5EE',text:'#085041'},{bg:'#FCEBEB',text:'#A32D2D'},
  {bg:'#F1EFE8',text:'#444441'},{bg:'#E6F1FB',text:'#185FA5'},
];

const DEFAULT_PLAYERS = [
  'Joueur 1','Joueur 2','Joueur 3','Joueur 4','Joueur 5',
  'Joueur 6','Joueur 7','Joueur 8','Joueur 9','Joueur 10'
];

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

async function loadFromStorage() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) return JSON.parse(result.value);
  } catch(e) {}
  return null;
}

async function saveToStorage(data) {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {}
}

let state = { players: {}, matches: [] };

function initPlayers() {
  DEFAULT_PLAYERS.forEach((name, i) => {
    state.players[name] = {
      name, elo: 1000, wins: 0, losses: 0,
      color: AVATAR_COLORS[i % AVATAR_COLORS.length],
      eloHistory: [1000]
    };
  });
}

function calcElo(rA, rB, scoreA, scoreB) {
  const K = 32;
  const total = scoreA + scoreB;
  if (total === 0) return [rA, rB];
  const sA = scoreA / total;
  const sB = scoreB / total;
  const eA = 1 / (1 + Math.pow(10, (rB - rA) / 400));
  const eB = 1 - eA;
  const newA = Math.round(rA + K * (sA - eA));
  const newB = Math.round(rB + K * (sB - eB));
  return [newA, newB];
}

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
}

function showTab(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  document.querySelectorAll('.tab')[['classement','match','historique','joueurs'].indexOf(id)].classList.add('active');
  if (id === 'classement') renderLeaderboard();
  if (id === 'match') renderMatchForm();
  if (id === 'historique') renderHistory();
  if (id === 'joueurs') renderPlayers();
}

function renderLeaderboard() {
  const players = Object.values(state.players).sort((a,b) => b.elo - a.elo);
  const totalMatches = state.matches.length;
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-label">Joueurs</div><div class="stat-value">${players.length}</div></div>
    <div class="stat-card"><div class="stat-label">Matchs joués</div><div class="stat-value">${totalMatches}</div></div>
    <div class="stat-card"><div class="stat-label">Leader</div><div class="stat-value" style="font-size:16px;margin-top:4px;">${players[0]?.name || '—'}</div></div>
    <div class="stat-card"><div class="stat-label">ELO max</div><div class="stat-value">${players[0]?.elo || 1000}</div></div>
  `;

  const tbody = document.getElementById('leaderboard-body');
  tbody.innerHTML = players.map((p, i) => {
    const total = p.wins + p.losses;
    const pct = total > 0 ? Math.round(p.wins / total * 100) : 0;
    const hist = p.eloHistory;
    const trend = hist.length > 1 ? hist[hist.length-1] - hist[hist.length-2] : 0;
    const trendHtml = trend > 0
      ? `<span class="trend up"><i class="ti ti-trending-up"></i> +${trend}</span>`
      : trend < 0
      ? `<span class="trend down"><i class="ti ti-trending-down"></i> ${trend}</span>`
      : `<span class="trend neutral">—</span>`;
    const rankCls = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
    return `<tr>
      <td class="rank-num ${rankCls}">${medal || (i+1)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="avatar" style="width:28px;height:28px;font-size:11px;background:${p.color.bg};color:${p.color.text};">${getInitials(p.name)}</div>
          <span class="player-name">${p.name}</span>
        </div>
      </td>
      <td><span class="elo-badge">${p.elo}</span></td>
      <td style="color:var(--color-text-success);font-weight:500;">${p.wins}</td>
      <td style="color:var(--color-text-danger);">${p.losses}</td>
      <td style="font-size:13px;">${pct}%</td>
      <td>${trendHtml}</td>
    </tr>`;
  }).join('');
}

function renderMatchForm() {
  const names = Object.keys(state.players);
  const p1 = document.getElementById('p1-select');
  const p2 = document.getElementById('p2-select');
  const opts = names.map(n => `<option value="${n}">${n}</option>`).join('');
  p1.innerHTML = opts;
  p2.innerHTML = opts;
  if (names.length > 1) p2.selectedIndex = 1;
  document.getElementById('elo-preview').style.display = 'none';

  p1.onchange = p2.onchange = document.getElementById('score1').oninput = document.getElementById('score2').oninput = previewElo;
}

function previewElo() {
  const p1name = document.getElementById('p1-select').value;
  const p2name = document.getElementById('p2-select').value;
  if (p1name === p2name) { document.getElementById('elo-preview').style.display = 'none'; return; }
  const s1 = parseInt(document.getElementById('score1').value) || 0;
  const s2 = parseInt(document.getElementById('score2').value) || 0;
  const p1 = state.players[p1name];
  const p2 = state.players[p2name];
  const [ne1, ne2] = calcElo(p1.elo, p2.elo, s1, s2);
  const d1 = ne1 - p1.elo;
  const d2 = ne2 - p2.elo;
  document.getElementById('elo-preview').style.display = 'block';
  document.getElementById('elo-preview-content').innerHTML = `
    <div style="display:flex;gap:2rem;font-size:14px;">
      <div><span style="font-weight:500;">${p1name}</span> ${p1.elo} → <span style="font-weight:500;">${ne1}</span> <span style="${d1>=0?'color:var(--color-text-success)':'color:var(--color-text-danger)'}">(${d1>=0?'+':''}${d1})</span></div>
      <div><span style="font-weight:500;">${p2name}</span> ${p2.elo} → <span style="font-weight:500;">${ne2}</span> <span style="${d2>=0?'color:var(--color-text-success)':'color:var(--color-text-danger)'}">(${d2>=0?'+':''}${d2})</span></div>
    </div>`;
}

async function submitMatch() {
  const p1name = document.getElementById('p1-select').value;
  const p2name = document.getElementById('p2-select').value;
  if (p1name === p2name) { showToast('Sélectionne deux joueurs différents !'); return; }
  const s1 = parseInt(document.getElementById('score1').value) || 0;
  const s2 = parseInt(document.getElementById('score2').value) || 0;
  if (s1 === s2) { showToast('Le score ne peut pas être une égalité !'); return; }

  const p1 = state.players[p1name];
  const p2 = state.players[p2name];
  const [ne1, ne2] = calcElo(p1.elo, p2.elo, s1, s2);

  const match = {
    p1: p1name, p2: p2name, s1, s2,
    eloP1Before: p1.elo, eloP2Before: p2.elo,
    eloP1After: ne1, eloP2After: ne2,
    char1: document.getElementById('char1').value.trim(),
    char2: document.getElementById('char2').value.trim(),
    date: new Date().toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'}),
    winner: s1 > s2 ? p1name : p2name
  };

  p1.elo = ne1; p1.eloHistory.push(ne1);
  p2.elo = ne2; p2.eloHistory.push(ne2);
  if (s1 > s2) { p1.wins++; p2.losses++; } else { p2.wins++; p1.losses++; }
  state.matches.unshift(match);

  await saveToStorage(state);
  showToast(`Match enregistré ! ${match.winner} remporte la partie.`);
  document.getElementById('char1').value = '';
  document.getElementById('char2').value = '';
  document.getElementById('score1').value = 3;
  document.getElementById('score2').value = 0;
  document.getElementById('elo-preview').style.display = 'none';
}

function renderHistory() {
  const el = document.getElementById('match-history');
  if (state.matches.length === 0) {
    el.innerHTML = '<div class="empty-state"><i class="ti ti-sword" style="font-size:32px;display:block;margin-bottom:8px;"></i>Aucun match enregistré</div>';
    return;
  }
  el.innerHTML = state.matches.slice(0, 50).map(m => {
    const d1 = m.eloP1After - m.eloP1Before;
    const d2 = m.eloP2After - m.eloP2Before;
    const p1 = state.players[m.p1];
    const p2 = state.players[m.p2];
    return `<div class="match-item">
      <div class="match-players">
        <div class="avatar" style="width:28px;height:28px;font-size:11px;background:${p1?.color.bg||'#eee'};color:${p1?.color.text||'#333'};">${getInitials(m.p1)}</div>
        <span style="font-weight:${m.winner===m.p1?'500':'400'}">${m.p1}${m.char1?' <span style="font-size:12px;color:var(--color-text-secondary);">('+m.char1+')</span>':''}</span>
        <div class="match-score">${m.s1} – ${m.s2}</div>
        <span style="font-weight:${m.winner===m.p2?'500':'400'}">${m.p2}${m.char2?' <span style="font-size:12px;color:var(--color-text-secondary);">('+m.char2+')</span>':''}</span>
        <div class="avatar" style="width:28px;height:28px;font-size:11px;background:${p2?.color.bg||'#eee'};color:${p2?.color.text||'#333'};">${getInitials(m.p2)}</div>
      </div>
      <div class="match-elo">
        <span style="color:${d1>=0?'var(--color-text-success)':'var(--color-text-danger)'}">${d1>=0?'+':''}${d1}</span>
        / <span style="color:${d2>=0?'var(--color-text-success)':'var(--color-text-danger)'}">${d2>=0?'+':''}${d2}</span>
      </div>
      <div class="match-date">${m.date}</div>
    </div>`;
  }).join('');
}

function renderPlayers() {
  const players = Object.values(state.players).sort((a,b) => b.elo - a.elo);
  document.getElementById('player-grid').innerHTML = players.map(p => {
    const total = p.wins + p.losses;
    return `<div class="player-card">
      <div class="avatar" style="background:${p.color.bg};color:${p.color.text};">${getInitials(p.name)}</div>
      <div class="player-info">
        <div class="name">${p.name}</div>
        <div class="stats">ELO ${p.elo} · ${p.wins}V ${p.losses}D</div>
      </div>
      <button class="btn-danger" onclick="removePlayer('${p.name}')" aria-label="Supprimer ${p.name}"><i class="ti ti-trash"></i></button>
    </div>`;
  }).join('');
}

async function addPlayer() {
  const input = document.getElementById('new-player-name');
  const name = input.value.trim();
  if (!name) { showToast('Entre un pseudo valide.'); return; }
  if (state.players[name]) { showToast('Ce joueur existe déjà !'); return; }
  const idx = Object.keys(state.players).length;
  state.players[name] = {
    name, elo: 1000, wins: 0, losses: 0,
    color: AVATAR_COLORS[idx % AVATAR_COLORS.length],
    eloHistory: [1000]
  };
  input.value = '';
  await saveToStorage(state);
  showToast(`${name} rejoint la league !`);
  renderPlayers();
}

async function removePlayer(name) {
  const p = state.players[name];
  if (!p) return;
  if (p.wins + p.losses > 0) {
    if (!confirm(`${name} a des matchs enregistrés. Supprimer quand même ?`)) return;
  }
  delete state.players[name];
  await saveToStorage(state);
  showToast(`${name} retiré de la league.`);
  renderPlayers();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function init() {
  const saved = await loadFromStorage();
  if (saved && saved.players && Object.keys(saved.players).length > 0) {
    state = saved;
    Object.values(state.players).forEach((p, i) => {
      if (!p.color) p.color = AVATAR_COLORS[i % AVATAR_COLORS.length];
      if (!p.eloHistory) p.eloHistory = [p.elo];
    });
  } else {
    initPlayers();
    await saveToStorage(state);
  }
  renderLeaderboard();
}

init();
</script>
